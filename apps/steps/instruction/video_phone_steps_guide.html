<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone steps guide</title>
<style>
:root{--primary:#6f7a8a;--bg:#f4f5f7;--text:#1f2328;--muted:#5f6670;--card:#fff;--border:rgba(31,35,40,.14);--shadow:0 14px 28px rgba(0,0,0,.08);--scroll-track:#e7eaee;--scroll-thumb:#a1a8b3}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track);overflow-x:hidden}
body{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,#d7dce2) 100%)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--scroll-track)}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--scroll-thumb) 82%,#000)}
.layout{max-width:1260px;margin:0 auto;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) min(200px,28vw);gap:10px}
.content{min-width:0}
.hero{padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 78%,#e5e8ed) 0%,var(--card) 68%);box-shadow:var(--shadow);margin-bottom:12px}
.hero h1{margin:0 0 6px;font-size:clamp(17px,2.6vw,26px)}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.step{border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.06);padding:10px;margin-bottom:10px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.step:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.11);border-color:color-mix(in srgb,var(--primary) 42%,var(--border))}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{flex:0 0 auto;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(145deg,#7f8794,#5d6674)}
.step h2{margin:0;font-size:16px}
.step p{margin:0 0 10px;color:var(--muted);line-height:1.45}
.img-wrap{overflow:hidden;border-radius:10px;border:1px solid var(--border);background:color-mix(in srgb,var(--card) 85%,var(--bg));display:flex;justify-content:center;align-items:center;padding:6px}
.img-wrap img{display:block;width:auto;height:auto;max-width:min(100%,300px);max-height:320px;object-fit:contain;cursor:zoom-in;transition:transform .35s ease,filter .25s ease}
.img-wrap img:hover{filter:saturate(1.04)}
.step:hover .img-wrap img{transform:scale(1.008)}
.map{position:sticky;top:12px;align-self:start;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.07);padding:10px}
.map h3{margin:2px 0 10px;font-size:14px}
.map a{display:block;text-decoration:none;color:var(--text);font-size:12px;line-height:1.3;padding:6px 8px;border-radius:10px;margin-bottom:5px;border:1px solid transparent;transition:all .2s ease}
.map a:hover,.map a.active{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.end{margin:4px 0 0;color:var(--muted);font-size:13px}
.viewer{position:fixed;inset:0;background:rgba(8,10,13,.84);display:none;align-items:center;justify-content:center;padding:3vh 2vw;z-index:9999;opacity:0;transition:opacity .2s ease}
.viewer.open{display:flex;opacity:1}
.viewer img{max-width:94vw;max-height:94vh;width:auto;height:auto;border-radius:14px;border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 50px rgba(0,0,0,.45);cursor:zoom-out}
.viewer-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}
[data-theme=dark]{--primary:#6f7a8a;--bg:#121417;--text:#e7ebf0;--muted:#a1a8b3;--card:#1d2128;--border:rgba(255,255,255,.11);--shadow:0 18px 38px rgba(0,0,0,.38);--scroll-track:#1a1e25;--scroll-thumb:#575f6d}
[data-theme=dark] body{background:linear-gradient(180deg,#121417 0%,#171b21 100%)}
@media (max-width:980px){.layout{grid-template-columns:1fr}.map{position:relative;top:0;order:-1}}
</style>
</head>
<body>
<div class="layout">
<main class="content">
<section class="hero">
<h1 id="title"></h1>
<p id="subtitle"></p>
</section>
<section id="s1" class="step"><div class="step-h"><div class="badge">1</div><h2 data-k="s1t"></h2></div><p data-k="s1d"></p><div class="img-wrap"><img src="photos_from_video/wait_to_sync.webp" alt="" loading="lazy"></div></section>
<section id="s2" class="step"><div class="step-h"><div class="badge">2</div><h2 data-k="s2t"></h2></div><p data-k="s2d"></p><div class="img-wrap"><img src="photos_from_video/sync_ok.webp" alt="" loading="lazy"></div></section>
<section id="s3" class="step"><div class="step-h"><div class="badge">3</div><h2 data-k="s3t"></h2></div><p data-k="s3d"></p></section>
<section id="s4" class="step"><div class="step-h"><div class="badge">4</div><h2 data-k="s4t"></h2></div><p data-k="s4d"></p><div class="img-wrap"><img src="photos_from_video/choose_mounth_mode.webp" alt="" loading="lazy"></div></section>
<section id="s5" class="step"><div class="step-h"><div class="badge">5</div><h2 data-k="s5t"></h2></div><p data-k="s5d"></p><div class="img-wrap"><img src="photos_from_video/select_prefer_mounth.webp" alt="" loading="lazy"></div></section>
<section id="s6" class="step"><div class="step-h"><div class="badge">6</div><h2 data-k="s6t"></h2></div><p data-k="s6d"></p><div class="img-wrap"><img src="photos_from_video/choose_day.webp" alt="" loading="lazy"></div></section>
<section id="s7" class="step"><div class="step-h"><div class="badge">7</div><h2 data-k="s7t"></h2></div><p data-k="s7d"></p><div class="img-wrap"><img src="photos_from_video/swipe.webp" alt="" loading="lazy"></div></section>
<p class="end" id="end"></p>
</main>
<aside class="map">
<h3 id="mapTitle"></h3>
<a href="#s1" data-k="m1"></a>
<a href="#s2" data-k="m2"></a>
<a href="#s3" data-k="m3"></a>
<a href="#s4" data-k="m4"></a>
<a href="#s5" data-k="m5"></a>
<a href="#s6" data-k="m6"></a>
<a href="#s7" data-k="m7"></a>
</aside>
</div>
<div class="viewer" id="imgViewer" aria-hidden="true"><button class="viewer-close" id="imgViewerClose" type="button" aria-label="Close">×</button><img id="imgViewerImage" src="" alt=""></div>
<script>
const i18n={en:{title:"Prepare the steps chart on your phone",subtitle:"Complete these steps on the device, then record the screen and upload the video in the Video tab above.",mapTitle:"Mini map",end:"When the chart shows every day you need, record the video and start recognition here.",s1t:"Wait for sync",s1d:"Wait until synchronization finishes. The screen may show “Wake to sync” until data is ready.",s2t:"Sync finished",s2d:"When sync succeeds, you will see a confirmation state (e.g. “Sync OK”).",s3t:"Open steps",s3d:"Tap the steps icon to open the step history.",s4t:"Month mode",s4d:"Switch the chart to month view.",s5t:"Pick the month",s5d:"Select the month that contains the days you want in the video.",s6t:"Pick the day",s6d:"Select the day you will start from on the chart.",s7t:"Scroll the chart",s7d:"Swipe horizontally across the graph for as many days as you need to capture for step recognition from the video.",m1:"1. Wake to sync",m2:"2. Sync OK",m3:"3. Steps icon",m4:"4. Month mode",m5:"5. Month",m6:"6. Day",m7:"7. Scroll"},
ru:{title:"Подготовьте график шагов на телефоне",subtitle:"Выполните шаги на устройстве, затем запишите экран и загрузите видео во вкладке «Видео» выше.",mapTitle:"Мини-карта",end:"Когда на графике видны все нужные дни, запишите видео и запустите распознавание здесь.",s1t:"Дождитесь синхронизации",s1d:"Дождитесь окончания синхронизации. На экране может быть «Wake to sync», пока данные подгружаются.",s2t:"Синхронизация успешна",s2d:"Когда синхронизация прошла успешно, появится подтверждение (например «Sync OK»).",s3t:"Иконка шагов",s3d:"Нажмите на иконку шагов.",s4t:"Режим месяца",s4d:"Переключитесь в режим месяца.",s5t:"Выбор месяца",s5d:"Выберите нужный месяц.",s6t:"Выбор дня",s6d:"Выберите нужный день.",s7t:"Прокрутка графика",s7d:"Пролистывайте пальцем график на столько дней, сколько нужно, чтобы с видео распознать шаги.",m1:"1. Wake to sync",m2:"2. Sync OK",m3:"3. Шаги",m4:"4. Режим месяца",m5:"5. Месяц",m6:"6. День",m7:"7. График"},
uk:{title:"Підготуйте графік кроків на телефоні",subtitle:"Виконайте кроки на пристрої, потім запишіть екран і завантажте відео у вкладці «Відео».",mapTitle:"Міні-мапа",end:"Коли на графіку видно всі потрібні дні, запишіть відео й запустіть розпізнавання тут.",s1t:"Дочекайтесь синхронізації",s1d:"Дочекайтесь завершення синхронізації. Може бути «Wake to sync», доки дані завантажуються.",s2t:"Синхронізація готова",s2d:"Після успіху з’явиться підтвердження (на кшталт «Sync OK»).",s3t:"Іконка кроків",s3d:"Натисніть іконку кроків.",s4t:"Режим місяця",s4d:"Перейдіть у перегляд за місяцем.",s5t:"Вибір місяця",s5d:"Оберіть потрібний місяць.",s6t:"Вибір дня",s6d:"Оберіть потрібний день.",s7t:"Гортання графіка",s7d:"Проведіть пальцем по графіку на кількість днів, яку треба зняти для розпізнавання.",m1:"1. Wake to sync",m2:"2. Sync OK",m3:"3. Кроки",m4:"4. Місяць",m5:"5. Місяць",m6:"6. День",m7:"7. Графік"},
be:{title:"Падрыхтуйце графік крокаў на тэлефоне",subtitle:"Выканайце крокі на прыладзе, затым запішыце экран і загрузіце відэа ў укладцы «Відэа».",mapTitle:"Міні-карта",end:"Калі на графіку ўсе патрэбныя дні, запішыце відэа і запусціце распазнаванне тут.",s1t:"Дачакайцеся сінхранізацыі",s1d:"Дачакайцеся завяршэння. Можа быць «Wake to sync», пакуль дадзеныя падцягваюцца.",s2t:"Сінхранізацыя паспяховая",s2d:"Пасля гэтага з’явіцца пацвярджэнне (напрыклад «Sync OK»).",s3t:"Значок крокаў",s3d:"Націсніце на значок крокаў.",s4t:"Рэжым месяца",s4d:"Пераключыцеся ў рэжым месяца.",s5t:"Выбар месяца",s5d:"Абярыце патрабаваны месяц.",s6t:"Выбар дня",s6d:"Абярыце патрабаваны дзень.",s7t:"Пракрутка графіка",s7d:"Пралістоўвайце пальцам графік на столькі дзён, колькі трэба для распазнавання крокаў з відэа.",m1:"1. Wake to sync",m2:"2. Sync OK",m3:"3. Крокі",m4:"4. Месяц",m5:"5. Месяц",m6:"6. Дзень",m7:"7. Графік"}};
const q=new URLSearchParams(location.search);
const lang=(q.get("lang")||"en").toLowerCase();
const theme=(q.get("theme")||"light").toLowerCase();
const color=q.get("color")||"#007bff";
document.documentElement.setAttribute("data-theme",theme==="dark"?"dark":"light");
document.documentElement.style.setProperty("--primary",color);
const t=i18n[lang]||i18n.en;
document.documentElement.lang=lang;
document.getElementById("title").textContent=t.title;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("mapTitle").textContent=t.mapTitle;
document.getElementById("end").textContent=t.end;
document.querySelectorAll("[data-k]").forEach(el=>{const k=el.getAttribute("data-k");if(t[k])el.textContent=t[k];});
const imgMap={0:"m1",1:"m2",2:"m4",3:"m5",4:"m6",5:"m7"};
document.querySelectorAll(".img-wrap img").forEach((img,i)=>{const k=imgMap[i];if(k&&t[k])img.alt=t[k];});
const navLinks=[...document.querySelectorAll(".map a")];
const obs=new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){const id=en.target.id;navLinks.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+id));}})},{rootMargin:"-40% 0px -50% 0px",threshold:.01});
document.querySelectorAll(".step").forEach(s=>obs.observe(s));
const viewer=document.getElementById("imgViewer");
const viewerImg=document.getElementById("imgViewerImage");
const viewerClose=document.getElementById("imgViewerClose");
const closeViewer=()=>{viewer.classList.remove("open");viewer.setAttribute("aria-hidden","true");viewerImg.src="";};
const postOpenToParent=(src,alt)=>{try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"takeout-guide-image-open",src,alt:alt||""},"*");return true}}catch(e){}return false};
const postCloseToParent=()=>{try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"takeout-guide-image-close"},"*");return true}}catch(e){}return false};
document.querySelectorAll(".img-wrap img").forEach(img=>{img.addEventListener("click",()=>{if(postOpenToParent(img.src,img.alt||""))return;viewerImg.src=img.src;viewerImg.alt=img.alt||"";viewer.classList.add("open");viewer.setAttribute("aria-hidden","false");});});
viewerClose.addEventListener("click",closeViewer);
viewer.addEventListener("click",e=>{if(e.target===viewer||e.target===viewerImg)closeViewer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(postCloseToParent())return;if(viewer.classList.contains("open"))closeViewer();}});
</script>
</body>
</html>
