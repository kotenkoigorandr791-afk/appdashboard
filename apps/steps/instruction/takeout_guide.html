<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takeout Guide</title>
<style>
:root{--primary:#6f7a8a;--bg:#f4f5f7;--text:#1f2328;--muted:#5f6670;--card:#fff;--border:rgba(31,35,40,.14);--shadow:0 14px 28px rgba(0,0,0,.08);--scroll-track:#e7eaee;--scroll-thumb:#a1a8b3}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
body{background:linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,#d7dce2) 100%)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--scroll-track)}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:999px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--scroll-thumb) 82%,#000)}
.layout{max-width:1260px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px}
.content{min-width:0}
.hero{padding:18px 20px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--card) 78%,#e5e8ed) 0%,var(--card) 68%);box-shadow:var(--shadow);margin-bottom:12px}
.hero h1{margin:0 0 8px;font-size:clamp(20px,3vw,30px)}
.hero p{margin:0;color:var(--muted);line-height:1.5}
.step{border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.06);padding:12px;margin-bottom:12px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.step:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.11);border-color:color-mix(in srgb,var(--primary) 42%,var(--border))}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.badge{flex:0 0 auto;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(145deg,#7f8794,#5d6674)}
.step h2{margin:0;font-size:18px}
.step p{margin:0 0 10px;color:var(--muted);line-height:1.45}
.img-wrap{overflow:hidden;border-radius:10px;border:1px solid var(--border);background:color-mix(in srgb,var(--card) 85%,var(--bg));display:flex;justify-content:center;align-items:center;width:fit-content;margin:0 auto}
.img-wrap img{display:block;max-width:25%;height:auto;cursor:zoom-in;transition:transform .35s ease,filter .25s ease}
.img-wrap img:hover{filter:saturate(1.04)}
.step:hover .img-wrap img{transform:scale(1.008)}
.map{position:sticky;top:12px;align-self:start;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:0 10px 24px rgba(0,0,0,.07);padding:12px}
.map h3{margin:2px 0 10px;font-size:14px}
.map a{display:block;text-decoration:none;color:var(--text);font-size:13px;line-height:1.3;padding:8px 10px;border-radius:10px;margin-bottom:5px;border:1px solid transparent;transition:all .2s ease}
.map a:hover,.map a.active{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,transparent)}
.end{margin:4px 0 0;color:var(--muted);font-size:13px}
.viewer{position:fixed;inset:0;background:rgba(8,10,13,.84);display:none;align-items:center;justify-content:center;padding:3vh 2vw;z-index:9999;opacity:0;transition:opacity .2s ease}
.viewer.open{display:flex;opacity:1}
.viewer img{max-width:94vw;max-height:94vh;width:auto;height:auto;border-radius:14px;border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 50px rgba(0,0,0,.45);cursor:zoom-out}
.viewer-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer}
[data-theme=dark]{--primary:#6f7a8a;--bg:#121417;--text:#e7ebf0;--muted:#a1a8b3;--card:#1d2128;--border:rgba(255,255,255,.11);--shadow:0 18px 38px rgba(0,0,0,.38);--scroll-track:#1a1e25;--scroll-thumb:#575f6d}
[data-theme=dark] body{background:linear-gradient(180deg,#121417 0%,#171b21 100%)}
@media (max-width:980px){.layout{grid-template-columns:1fr}.map{position:relative;top:0;order:-1}}
</style>
</head>
<body>
<div class="layout">
<main class="content">
<section class="hero">
<h1 id="title"></h1>
<p id="subtitle"></p>
</section>
<section id="s1" class="step"><div class="step-h"><div class="badge">1</div><h2 data-k="s1t"></h2></div><p data-k="s1d"></p><div class="img-wrap"><img src="photos/takeout_deselect_all.webp" alt="" loading="lazy"></div></section>
<section id="s2" class="step"><div class="step-h"><div class="badge">2</div><h2 data-k="s2t"></h2></div><p data-k="s2d"></p><div class="img-wrap"><img src="photos/select_fit.webp" alt="" loading="lazy"></div></section>
<section id="s3" class="step"><div class="step-h"><div class="badge">3</div><h2 data-k="s3t"></h2></div><p data-k="s3d"></p><div class="img-wrap"><img src="photos/scroll_down_click_next.webp" alt="" loading="lazy"></div></section>
<section id="s4" class="step"><div class="step-h"><div class="badge">4</div><h2 data-k="s4t"></h2></div><p data-k="s4d"></p><div class="img-wrap"><img src="photos/choose_type_zip.webp" alt="" loading="lazy"></div></section>
<section id="s5" class="step"><div class="step-h"><div class="badge">5</div><h2 data-k="s5t"></h2></div><p data-k="s5d"></p><div class="img-wrap"><img src="photos/create_export.webp" alt="" loading="lazy"></div></section>
<section id="s6" class="step"><div class="step-h"><div class="badge">6</div><h2 data-k="s6t"></h2></div><p data-k="s6d"></p><div class="img-wrap"><img src="photos/download_vie_meil.webp" alt="" loading="lazy"></div></section>
<section id="s7" class="step"><div class="step-h"><div class="badge">7</div><h2 data-k="s7t"></h2></div><p data-k="s7d"></p><div class="img-wrap"><img src="photos/done.webp" alt="" loading="lazy"></div></section>
<p class="end" id="end"></p>
</main>
<aside class="map">
<h3 id="mapTitle"></h3>
<a href="#s1" data-k="m1"></a>
<a href="#s2" data-k="m2"></a>
<a href="#s3" data-k="m3"></a>
<a href="#s4" data-k="m4"></a>
<a href="#s5" data-k="m5"></a>
<a href="#s6" data-k="m6"></a>
<a href="#s7" data-k="m7"></a>
</aside>
</div>
<div class="viewer" id="imgViewer" aria-hidden="true"><button class="viewer-close" id="imgViewerClose" type="button" aria-label="Close">×</button><img id="imgViewerImage" src="" alt=""></div>
<script>
const i18n={en:{title:"How to get Google Takeout ZIP for import",subtitle:"Follow these steps and then return to the ZIP block above in the Takeout tab.",mapTitle:"Mini map",end:"After download, choose this ZIP in the app and click import.",s1t:"Open Google Takeout and clear all",s1d:"Go to takeout.google.com, click Deselect all to start from clean export settings.",s2t:"Enable only Google Fit",s2d:"Find Google Fit in the list and turn it on. Keep only data needed for daily steps/activity.",s3t:"Go to the export settings",s3d:"Scroll down and click Next step to move to archive options.",s4t:"Select ZIP format",s4d:"Set file type to ZIP and choose archive size you prefer.",s5t:"Create export",s5d:"Click Create export. Google starts preparing your archive.",s6t:"Wait for email and open download",s6d:"When export is ready, open the email and press Download your files.",s7t:"Download archive",s7d:"Save ZIP to device. Then load it in the app Takeout section.",m1:"1. Deselect all",m2:"2. Select Google Fit",m3:"3. Next step",m4:"4. ZIP settings",m5:"5. Create export",m6:"6. Open email",m7:"7. Download ZIP"},
ru:{title:"Как получить ZIP Google Takeout для импорта",subtitle:"Выполните шаги и вернитесь к блоку ZIP выше во вкладке Takeout.",mapTitle:"Мини-карта",end:"После загрузки выберите ZIP в приложении и нажмите импорт.",s1t:"Откройте Google Takeout и снимите выделение",s1d:"Перейдите на takeout.google.com и нажмите «Отменить выбор», чтобы начать с чистых настроек.",s2t:"Оставьте только Google Fit",s2d:"Найдите Google Fit и включите только его. Оставьте данные по шагам/активности.",s3t:"Перейдите к настройкам выгрузки",s3d:"Прокрутите вниз и нажмите «Следующий шаг».",s4t:"Выберите формат ZIP",s4d:"Укажите тип файла ZIP и нужный размер архива.",s5t:"Создайте экспорт",s5d:"Нажмите «Создать экспорт». Google начнет собирать архив.",s6t:"Дождитесь письма и откройте скачивание",s6d:"Когда экспорт готов, откройте письмо и нажмите «Скачать файлы».",s7t:"Скачайте архив",s7d:"Сохраните ZIP на устройство и загрузите его в секции Takeout приложения.",m1:"1. Отменить выбор",m2:"2. Google Fit",m3:"3. Следующий шаг",m4:"4. ZIP параметры",m5:"5. Создать экспорт",m6:"6. Письмо",m7:"7. Скачать ZIP"},
uk:{title:"Як отримати ZIP Google Takeout для імпорту",subtitle:"Виконайте кроки й поверніться до блоку ZIP вище у вкладці Takeout.",mapTitle:"Міні-мапа",end:"Після завантаження виберіть ZIP у застосунку та натисніть імпорт.",s1t:"Відкрийте Google Takeout і скасуйте вибір",s1d:"Перейдіть на takeout.google.com і натисніть «Скасувати вибір».",s2t:"Залиште лише Google Fit",s2d:"Знайдіть Google Fit і увімкніть тільки його. Залиште дані про кроки/активність.",s3t:"Перейдіть до параметрів експорту",s3d:"Прокрутіть вниз і натисніть «Наступний крок».",s4t:"Оберіть формат ZIP",s4d:"Вкажіть тип файлу ZIP і розмір архіву.",s5t:"Створіть експорт",s5d:"Натисніть «Створити експорт». Google підготує архів.",s6t:"Дочекайтесь листа й відкрийте завантаження",s6d:"Коли експорт готовий, відкрийте лист і натисніть «Завантажити файли».",s7t:"Завантажте архів",s7d:"Збережіть ZIP на пристрій і завантажте його в секції Takeout застосунку.",m1:"1. Скасувати вибір",m2:"2. Google Fit",m3:"3. Наступний крок",m4:"4. ZIP параметри",m5:"5. Створити експорт",m6:"6. Лист",m7:"7. Завантажити ZIP"},
be:{title:"Як атрымаць ZIP Google Takeout для імпарту",subtitle:"Выканайце крокі і вярніцеся да блока ZIP вышэй у ўкладцы Takeout.",mapTitle:"Міні-карта",end:"Пасля загрузкі абярыце ZIP у праграме і націсніце імпарт.",s1t:"Адкрыйце Google Takeout і зніміце выбар",s1d:"Перайдзіце на takeout.google.com і націсніце «Скасаваць выбар».",s2t:"Пакіньце толькі Google Fit",s2d:"Знайдзіце Google Fit і ўключыце толькі яго. Пакіньце дадзеныя пра крокі/актыўнасць.",s3t:"Перайдзіце да налад экспарту",s3d:"Пракруціце ўніз і націсніце «Наступны крок».",s4t:"Абярыце ZIP-фармат",s4d:"Укажыце тып файла ZIP і памер архіва.",s5t:"Стварыце экспарт",s5d:"Націсніце «Стварыць экспарт». Google падрыхтуе архіў.",s6t:"Дачакайцеся ліста і адкрыйце загрузку",s6d:"Калі экспарт гатовы, адкрыйце ліст і націсніце «Спампаваць файлы».",s7t:"Спампуйце архіў",s7d:"Захавайце ZIP на прыладу і загрузіце яго ў секцыі Takeout праграмы.",m1:"1. Скасаваць выбар",m2:"2. Google Fit",m3:"3. Наступны крок",m4:"4. ZIP налады",m5:"5. Стварыць экспарт",m6:"6. Ліст",m7:"7. Спампаваць ZIP"}};
const q=new URLSearchParams(location.search);
const lang=(q.get("lang")||"en").toLowerCase();
const theme=(q.get("theme")||"light").toLowerCase();
const color=q.get("color")||"#007bff";
document.documentElement.setAttribute("data-theme",theme==="dark"?"dark":"light");
document.documentElement.style.setProperty("--primary",color);
const t=i18n[lang]||i18n.en;
document.documentElement.lang=lang;
document.getElementById("title").textContent=t.title;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("mapTitle").textContent=t.mapTitle;
document.getElementById("end").textContent=t.end;
document.querySelectorAll("[data-k]").forEach(el=>{const k=el.getAttribute("data-k");if(t[k])el.textContent=t[k];});
document.querySelectorAll(".img-wrap img").forEach((img,idx)=>{img.alt=(t["m"+(idx+1)]||"Step "+(idx+1));});
const navLinks=[...document.querySelectorAll(".map a")];
const obs=new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){const id=en.target.id;navLinks.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+id));}})},{rootMargin:"-40% 0px -50% 0px",threshold:.01});
document.querySelectorAll(".step").forEach(s=>obs.observe(s));
const viewer=document.getElementById("imgViewer");
const viewerImg=document.getElementById("imgViewerImage");
const viewerClose=document.getElementById("imgViewerClose");
const closeViewer=()=>{viewer.classList.remove("open");viewer.setAttribute("aria-hidden","true");viewerImg.src="";};
const postOpenToParent=(src,alt)=>{try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"takeout-guide-image-open",src,alt:alt||""},"*");return true}}catch(e){}return false};
const postCloseToParent=()=>{try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:"takeout-guide-image-close"},"*");return true}}catch(e){}return false};
document.querySelectorAll(".img-wrap img").forEach(img=>{img.addEventListener("click",()=>{if(postOpenToParent(img.src,img.alt||""))return;viewerImg.src=img.src;viewerImg.alt=img.alt||"";viewer.classList.add("open");viewer.setAttribute("aria-hidden","false");});});
viewerClose.addEventListener("click",closeViewer);
viewer.addEventListener("click",e=>{if(e.target===viewer||e.target===viewerImg)closeViewer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(postCloseToParent())return;if(viewer.classList.contains("open"))closeViewer();}});
</script>
</body>
</html>
