      c-17.719,0-32.134,14.415-32.134,32.134v220.653c0,17.719,14.415,32.134,32.134,32.134h251.18
      c17.719,0,32.134-14.415,32.134-32.134v-64.802h16.067V155.999z"/>
    <path d="M284.995,62.809c9.897,0,17.982,7.519,19.068,17.14h-24.152l-9.525-17.14H284.995z"/>
    <path d="M220.996,13.663c3.014-1.69,7.07-0.508,8.734,2.494l35.476,63.786H101.798L220.996,13.663z"/>
    <path d="M304.275,302.742c0,10.63-8.651,19.281-19.281,19.281H33.815c-10.63,0-19.281-8.651-19.281-19.281V82.09
      c0-10.63,8.651-19.281,19.281-19.281h72.353L75.345,79.95H37.832c-3.554,0-6.427,2.879-6.427,6.427s2.873,6.427,6.427,6.427h14.396
      h234.83h17.217v63.201h-46.999c-21.826,0-39.589,17.764-39.589,39.589v2.764c0,21.826,17.764,39.589,39.589,39.589h46.999V302.742z"/>
    <!-- Coin slot area - lighter shade -->
    <path d="M320.342,225.087h-3.213h-59.853c-14.743,0-26.736-11.992-26.736-26.736v-2.764
      c0-14.743,11.992-26.736,26.736-26.736h59.853h3.213V225.087z" fill="#059669"/>
    <!-- Original coin circle from the icon -->
    <circle cx="262.771" cy="197.497" r="14.19" fill="#047857"/>
