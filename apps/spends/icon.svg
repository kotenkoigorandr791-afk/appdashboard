  <!-- Glow effect on coin area -->
  <ellipse cx="262.771" cy="197.497" rx="25" ry="25" fill="url(#slotGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Animated glowing coin -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="262.771" cy="197.497" r="14.19" fill="#34D399">
      <animate attributeName="fill" values="#34D399;#6EE7B7;#34D399" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Coin shine -->
    <ellipse cx="258" cy="191" rx="5" ry="2.5" fill="#FFF" transform="rotate(-30 258 191)" opacity="0.5"/>
  </g>
</svg>
