<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Outer film frame - solid color, no fill gradient -->
  <path fill="#F97316" d="M0 4c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4z"/>
  <!-- Inner film area - darker shade -->
  <rect x="6" y="4" width="8" height="12" fill="#C2410C"/>
  <!-- Play button triangle - animated -->
  <polygon points="8,7 13,10 8,13" fill="#FFF7ED">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="1.5s" repeatCount="indefinite" additive="sum"/>
  </polygon>
  <!-- Sprocket holes left -->
  <rect x="2" y="5" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
  <rect x="2" y="9" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
  <rect x="2" y="13" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
  <!-- Sprocket holes right -->
  <rect x="16.5" y="5" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
  <rect x="16.5" y="9" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
  <rect x="16.5" y="13" width="1.5" height="2" rx="0.5" fill="#FFF7ED"/>
</svg>
