<?xml version="1.0" ?><svg data-name="Layer 1" id="Layer_1" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="viewerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#818CF8;#6366F1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#6366F1;#4F46E5" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      @keyframes sweep-lens {
        0% { transform: rotate(-15deg); }
        50% { transform: rotate(15deg); }
        100% { transform: rotate(-15deg); }
      }
      @keyframes draw-lines {
        0% { stroke-dashoffset: 200; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      .lens-sweep {
        transform-origin: 30.76px 30.26px;
        animation: sweep-lens 3s ease-in-out infinite;
      }
      .globe-line {
        stroke-dasharray: 200;
        animation: draw-lines 4s ease-in-out infinite;
      }
      .globe-line:nth-child(2) { animation-delay: 0.3s; }
      .globe-line:nth-child(3) { animation-delay: 0.6s; }
      .globe-line:nth-child(4) { animation-delay: 0.9s; }
      .globe-line:nth-child(5) { animation-delay: 1.2s; }
      .globe-line:nth-child(6) { animation-delay: 1.5s; }
    </style>
  </defs>
  <!-- Globe that draws its lines -->
  <g fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-miterlimit="10">
    <path class="globe-line" d="M21.49561,42a20.5,20.5,0,1,1,20.5-20.5"/>
    <line class="globe-line" x1="21.49561" y1="1" x2="21.49561" y2="18.375"/>
    <path class="globe-line" d="M16.735,31.91739a41.51361,41.51361,0,0,0-11.37561,2.198"/>
    <path class="globe-line" d="M5.35937,8.88463C9.11178,10.32247,14.93672,11.25,21.49561,11.25s12.38383-.92753,16.13624-2.36537"/>
    <path class="globe-line" d="M33.30726,15.76183C31.81816,7.23282,27.09361,1,21.49561,1c-6.7931,0-12.3,9.17816-12.3,20.5s5.5069,20.5,12.3,20.5"/>
    <line class="globe-line" x1="18.75" y1="21.5" x2="0.81579" y2="21.5"/>
  </g>
  <!-- Magnifying glass scanning -->
  <g class="lens-sweep" fill="none" stroke="url(#viewerGrad)" stroke-width="2">
    <circle cx="30.76346" cy="30.26346" r="11.5" stroke-miterlimit="10">
      <animate attributeName="r" values="11.5;12.5;11.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <line x1="38.68749" y1="38.6875" x2="47.02698" y2="47.02702" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
