<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 512 512" xml:space="preserve">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316">
        <animate attributeName="stop-color" values="#F97316;#FB923C;#F97316;#EA580C;#F97316" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EA580C">
        <animate attributeName="stop-color" values="#EA580C;#F97316;#FB923C;#F97316;#EA580C" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C2410C">
        <animate attributeName="stop-color" values="#C2410C;#EA580C;#F97316;#EA580C;#C2410C" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- Steam gradient -->
    <linearGradient id="steamGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FDBA74" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0"/>
    </linearGradient>
  </defs>
