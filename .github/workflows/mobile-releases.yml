name: Mobile Releases

on:
  push:
    tags:
      - 'steps-v*'
      - 'spends-v*'

jobs:
  steps:
    if: startsWith(github.ref_name, 'steps-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: test -n "$KEYSTORE_BASE64" && echo "$KEYSTORE_BASE64" | base64 --decode > apps/steps/steps-mobile-app/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.STEPS_KEYSTORE_BASE64 }}
      - run: ./gradlew --no-daemon :app:assembleFossRelease
        working-directory: apps/steps/steps-mobile-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STEPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STEPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STEPS_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/steps/steps-mobile-app/app/build/outputs/apk/foss/release/*.apk
          generate_release_notes: true

  spends:
    if: startsWith(github.ref_name, 'spends-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: test -n "$KEYSTORE_BASE64" && echo "$KEYSTORE_BASE64" | base64 --decode > apps/spends/spends-native-android/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDS_KEYSTORE_BASE64 }}
      - run: apps/kanboard/kanboard-mobile-app/gradlew --no-daemon -p apps/spends/spends-native-android :app:assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SPENDS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPENDS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPENDS_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/spends/spends-native-android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
