name: Mobile Releases

on:
  push:
    tags:
      - 'steps-v*'
      - 'spends-v*'

permissions:
  contents: write

jobs:
  steps:
    if: startsWith(github.ref_name, 'steps-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: test -n "$KEYSTORE_BASE64" && echo "$KEYSTORE_BASE64" | base64 --decode > apps/steps/steps-mobile-app/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.STEPS_KEYSTORE_BASE64 }}
      - run: ./gradlew --no-daemon :app:assembleFossRelease
        working-directory: apps/steps/steps-mobile-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STEPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STEPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STEPS_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/steps/steps-mobile-app/app/build/outputs/apk/foss/release/*.apk
          generate_release_notes: true

  spends:
    if: startsWith(github.ref_name, 'spends-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/spends/spends-mobile-app/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: corepack enable && pnpm install --frozen-lockfile
        working-directory: apps/spends/spends-mobile-app
      - run: test -n "$KEYSTORE_BASE64" && echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
        working-directory: apps/spends/spends-mobile-app
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDS_KEYSTORE_BASE64 }}
      - run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/spends/spends-mobile-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SPENDS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPENDS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPENDS_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/spends/spends-mobile-app/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
