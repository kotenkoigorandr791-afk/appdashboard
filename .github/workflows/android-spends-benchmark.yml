name: Spends Android benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/spends/spends-native-android/**"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Assemble release with baseline profile
        working-directory: apps/spends/spends-native-android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Generate baseline profile (device required)
        if: false
        working-directory: apps/spends/spends-native-android
        run: ./gradlew :benchmark:pixel6Api34BenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile