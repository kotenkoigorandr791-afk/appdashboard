name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Android signing keys
        run: |
          echo "$STEPS_KEYSTORE_BASE64" | base64 --decode > apps/steps/steps-mobile-app/app/release.jks
          echo "$SPENDS_KEYSTORE_BASE64" | base64 --decode > apps/spends/spends-native-android/app/release.jks
        env:
          STEPS_KEYSTORE_BASE64: ${{ secrets.STEPS_KEYSTORE_BASE64 }}
          SPENDS_KEYSTORE_BASE64: ${{ secrets.SPENDS_KEYSTORE_BASE64 }}
      - name: Build bundled mobile apps
        run: |
          deploy/scripts/build-stepmonitor-apk.sh "$GITHUB_WORKSPACE"
          KEYSTORE_PASSWORD="$SPENDS_KEYSTORE_PASSWORD" KEY_ALIAS="$SPENDS_KEY_ALIAS" KEY_PASSWORD="$SPENDS_KEY_PASSWORD" deploy/scripts/build-spends-apk.sh "$GITHUB_WORKSPACE"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STEPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STEPS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STEPS_KEY_PASSWORD }}
          SPENDS_KEYSTORE_PASSWORD: ${{ secrets.SPENDS_KEYSTORE_PASSWORD }}
          SPENDS_KEY_ALIAS: ${{ secrets.SPENDS_KEY_ALIAS }}
          SPENDS_KEY_PASSWORD: ${{ secrets.SPENDS_KEY_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Read application version
        id: version
        run: echo "value=$(tr -dc '0-9.' < VERSION | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            APP_GIT_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard:sha-${{ github.sha }}
      - name: Build and publish Python sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/python-sidecar/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}-py:latest
            ghcr.io/${{ github.repository }}-py:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}-py:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard-py:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard-py:${{ steps.version.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/appdashboard-py:sha-${{ github.sha }}
      - name: Delete old image versions
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in appdashboard appdashboard-py; do
            gh api --paginate "/user/packages/container/$package/versions?per_page=100" --jq 'sort_by(.created_at) | reverse | .[2:] | .[].id' |
              while read -r version; do
                gh api --method DELETE "/user/packages/container/$package/versions/$version"
              done
          done
