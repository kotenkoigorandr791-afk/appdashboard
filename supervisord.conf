[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:ssh-ws]
command=/usr/local/bin/php /var/www/AppDashboard/webssh/server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
environment=SSH_WS_PORT="8765",SSH_WS_BIND="127.0.0.1"
priority=30

[program:smart-home-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/ws_server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
environment=SMART_HOME_WS_PORT="8766",SMART_HOME_WS_BIND="127.0.0.1"
priority=30

[program:cloud-collab-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/cloud/scripts/monaco_collab_ws.php 127.0.0.1 8767
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=30

[program:cloud-sync-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/cloud/scripts/cloud_sync_ws.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=30

[program:performance-collector]
command=/usr/local/bin/php /var/www/AppDashboard/apps/performance/bin/monitor_collector.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=40

[program:telegram-bot]
command=/var/www/AppDashboard/bot/.venv/bin/python3 /var/www/AppDashboard/bot/bot.py
directory=/var/www/AppDashboard/bot
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/www/AppDashboard/bot/bot.log
stderr_logfile=/var/www/AppDashboard/bot/bot.log
priority=50
