[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:mosquitto]
command=/usr/sbin/mosquitto -c /etc/mosquitto/conf.d/smarthome.conf
autostart=true
autorestart=true
priority=25

[program:smart-home-mqtt-auth]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_auth_sync.php --loop
directory=/var/www/AppDashboard
user=root
autostart=true
autorestart=true
priority=26

[program:smart-home-mqtt-worker]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_worker.php
directory=/var/www/AppDashboard
user=www-data
environment=SMART_HOME_MQTT_SHARDS="2",SMART_HOME_MQTT_SHARD="0"
autostart=true
autorestart=true
priority=31

[program:smart-home-mqtt-worker-2]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_worker.php
directory=/var/www/AppDashboard
user=www-data
environment=SMART_HOME_MQTT_SHARDS="2",SMART_HOME_MQTT_SHARD="1"
autostart=true
autorestart=true
priority=31

[program:ssh-ws]
command=/usr/local/bin/php /var/www/AppDashboard/webssh/server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopwaitsecs=10
environment=SSH_WS_PORT="8765",SSH_WS_BIND="127.0.0.1"
stdout_logfile=/var/log/supervisor/ssh-ws.log
stderr_logfile=/var/log/supervisor/ssh-ws.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
priority=30

[program:smart-home-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/ws_server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
environment=SMART_HOME_WS_PORT="8766",SMART_HOME_WS_BIND="127.0.0.1"
priority=30

[program:smart-home-ws-2]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/ws_server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
environment=SMART_HOME_WS_PORT="8786",SMART_HOME_WS_BIND="127.0.0.1"
priority=30

[program:smart-home-ws-3]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/ws_server.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
environment=SMART_HOME_WS_PORT="8787",SMART_HOME_WS_BIND="127.0.0.1"
priority=30

[program:cloud-collab-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/cloud/scripts/monaco_collab_ws.php 127.0.0.1 8767
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=30

[program:cloud-sync-ws]
command=/usr/local/bin/php /var/www/AppDashboard/apps/cloud/scripts/cloud_sync_ws.php
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=30

[program:appdashboard-mcp-http]
command=node /var/www/AppDashboard/appdashboard-mcp/dist/index.js --http --port=8808
directory=/var/www/AppDashboard/appdashboard-mcp
user=www-data
autostart=true
autorestart=true
environment=APPDASHBOARD_URL="http://localhost",NODE_ENV="production",MCP_PUBLIC_BASE="http://localhost:8808",OAUTH_APP_BASE="http://localhost"
priority=30

[program:performance-collector]
command=/usr/local/bin/php /var/www/AppDashboard/project/performance/bin/monitor_collector.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=40

[program:session-cleanup]
command=/usr/local/bin/php /var/www/AppDashboard/project/bin/cleanup_expired_sessions.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=45
stdout_logfile=/var/log/supervisor/session-cleanup.log
stderr_logfile=/var/log/supervisor/session-cleanup.log

[program:cookie-consent-cleanup]
command=/usr/local/bin/php /var/www/AppDashboard/project/bin/cleanup_stale_cookie_consents.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=46
stdout_logfile=/var/log/supervisor/cookie-consent-cleanup.log
stderr_logfile=/var/log/supervisor/cookie-consent-cleanup.log

[program:storage-usage-collector]
command=/usr/local/bin/php /var/www/AppDashboard/project/bin/storage_usage_collector.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=47
stdout_logfile=/var/log/supervisor/storage-usage-collector.log
stderr_logfile=/var/log/supervisor/storage-usage-collector.log

[program:backup-scheduler]
command=/usr/local/bin/php /var/www/AppDashboard/project/backup/scheduler.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=48
stdout_logfile=/var/log/supervisor/backup-scheduler.log
stderr_logfile=/var/log/supervisor/backup-scheduler.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB


[program:cloud-trash-purge]
command=/usr/local/bin/php /var/www/AppDashboard/apps/cloud/bin/purge_expired_trash.php --loop
directory=/var/www/AppDashboard
user=www-data
autostart=true
autorestart=true
priority=49
stdout_logfile=/var/log/supervisor/cloud-trash-purge.log
stderr_logfile=/var/log/supervisor/cloud-trash-purge.log

[program:telegram-bot]
command=/bin/sh -c "until /opt/ApplicationData/bot-venv/bin/python3 -c 'import psycopg2, bcrypt, requests, PIL' 2>/dev/null; do sleep 2; done; exec /opt/ApplicationData/bot-venv/bin/python3 /var/www/AppDashboard/bot/bot.py"
directory=/var/www/AppDashboard/bot
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/bot/bot.log
stderr_logfile=/var/log/bot/bot.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
priority=50
