[supervisord]
nodaemon=true
user=root
; Keep child-process temporary files on the APPDATA volume (see
; docker-entrypoint.sh). /var/log/supervisor is mounted as a named volume.
environment=TMPDIR="/opt/ApplicationData/tmp"
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:waf-log-rotate]
command=/bin/sh /var/www/AppDashboard/deploy/scripts/rotate-waf-log.sh
autostart=true
autorestart=true
priority=22

[program:mosquitto]
command=/usr/sbin/mosquitto -c /etc/mosquitto/conf.d/smarthome.conf
autostart=true
autorestart=true
startsecs=2
startretries=20
priority=25

[program:smart-home-mqtt-auth]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_auth_sync.php --loop
directory=/var/www/AppDashboard
user=root
autostart=true
autorestart=true
priority=26

[program:smart-home-mqtt-worker]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_worker.php
directory=/var/www/AppDashboard
user=www-data
environment=SMART_HOME_MQTT_SHARDS="2",SMART_HOME_MQTT_SHARD="0"
autostart=true
autorestart=true
priority=31

[program:smart-home-mqtt-worker-2]
command=/usr/local/bin/php /var/www/AppDashboard/apps/smart_home/mqtt_worker.php
