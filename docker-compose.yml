name: appdashboard

services:
  appdashboard-db:
    image: postgres:16
    container_name: appdashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdashboard
      POSTGRES_USER: appdashboard
      POSTGRES_PASSWORD: "${DB_PASSWORD:-appdashboard_dev_password}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - appdashboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdashboard -d appdashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  appdashboard-redis:
    image: redis:7-alpine
    container_name: appdashboard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - appdashboard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  appdashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: appdashboard:latest
    container_name: appdashboard
    entrypoint: ["/var/www/AppDashboard/docker-entrypoint.sh"]
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
    restart: unless-stopped
    privileged: true
    depends_on:
      appdashboard-db:
        condition: service_healthy
      appdashboard-redis:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      APP_DB_CONFIG: /opt/AppDashboard/data/db.env
      APP_DB_SKIP_SESSION_INIT: "1"
      APPDATA_BASE_DIR: /opt/ApplicationData
      DB_HOST: appdashboard-db
      DB_PORT: "5432"
      DB_NAME: appdashboard
      DB_USER: appdashboard
      DB_PASSWORD: "${DB_PASSWORD:-appdashboard_dev_password}"
      REDIS_HOST: appdashboard-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PREFIX: "appdashboard:"
      RUN_STARTUP_DEPS: "1"
      PHP_OPCACHE_ENABLE: "1"
      SSH_WS_PORT: "8765"
      SSH_WS_BIND: 127.0.0.1
      SMART_HOME_WS_PORT: "8766"
      SMART_HOME_WS_BIND: 127.0.0.1
    ports:
      - "80:80"
    volumes:
      - .:/var/www/AppDashboard
      - ./nginx/appdashboard.conf:/etc/nginx/sites-available/appdashboard.conf:ro
      - appdashboard-data:/opt/AppDashboard/data
      - appdashboard-appdata:/opt/ApplicationData
      - appdashboard-logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  appdashboard-logs:
  appdashboard-data:
  appdashboard-appdata:
  appdashboard-db-data:
  appdashboard-redis-data:
