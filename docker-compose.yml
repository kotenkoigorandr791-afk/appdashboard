name: appdashboard

services:
  appdashboard-db:
    profiles: ["container-db"]
    image: postgres:16
    container_name: appdashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdashboard
      POSTGRES_USER: appdashboard
      POSTGRES_PASSWORD: "${DB_PASSWORD:-appdashboard_dev_password}"
    # Публикация порта на хост не нужна: контейнеры общаются по docker-сети.
    expose:
      - "5432"
    volumes:
      - appdashboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdashboard -d appdashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  appdashboard-redis:
    image: redis:7-alpine
    container_name: appdashboard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Redis используется приложением внутри docker-сети.
    # Публикация порта на хост ломает `docker compose up`, если 16379 уже занят.
    expose:
      - "6379"
    volumes:
      - appdashboard-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  appdashboard-py:
    build:
      context: .
      dockerfile: deploy/python-sidecar/Dockerfile
    image: ${APPDASHBOARD_PY_IMAGE:-ihorkotenko/appdashboard-py:latest}
    container_name: appdashboard-py
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    expose:
      - "8100"
    environment:
      APP_DB_CONFIG: /opt/AppDashboard/data/db.env
      DB_HOST: "${DB_HOST:-appdashboard-db}"
      DB_PORT: "5432"
      DB_NAME: appdashboard
      DB_USER: appdashboard
      DB_PASSWORD: "${DB_PASSWORD:-appdashboard_dev_password}"
      MODELS_ROOT: /opt/ApplicationData/models
      HF_HOME: /opt/ApplicationData/models/huggingface
      U2NET_HOME: /opt/ApplicationData/models/rembg
      XDG_CACHE_HOME: /opt/ApplicationData/models/cache
      XDG_DATA_HOME: /opt/ApplicationData/models
      PREFETCH_MODELS: "${PREFETCH_MODELS:-1}"
    volumes:
      - .:/var/www/AppDashboard
      - appdashboard-data:/opt/AppDashboard/data
      - appdashboard-appdata:/opt/ApplicationData
    depends_on:
      appdashboard-db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  appdashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APPDASHBOARD_IMAGE:-ihorkotenko/appdashboard:latest}
    container_name: appdashboard
    entrypoint: ["/var/www/AppDashboard/docker-entrypoint.sh"]
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    privileged: true
    depends_on:
      appdashboard-redis:
        condition: service_healthy
      appdashboard-py:
        condition: service_started
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      # Single source of truth for public hostnames. Entrypoint derives ai./search./git./...
      BASE_DOMAIN: "${BASE_DOMAIN:-localhost}"
      APP_PUBLIC_SCHEME: "${APP_PUBLIC_SCHEME:-http}"
      APP_PUBLIC_BASE_URL: "${APP_PUBLIC_BASE_URL:-}"
      AI_PUBLIC_HOST: "${AI_PUBLIC_HOST:-}"
      AI_PUBLIC_URL: "${AI_PUBLIC_URL:-}"
      OMNIROUTE_UPSTREAM: "${OMNIROUTE_UPSTREAM:-http://host.docker.internal:20128}"
      SEARCH_PUBLIC_URL: "${SEARCH_PUBLIC_URL:-}"
      GITEA_PUBLIC_URL: "${GITEA_PUBLIC_URL:-}"
      GITEA_INTERNAL_URL: "${GITEA_INTERNAL_URL:-http://host.docker.internal:3001}"
      IMMICH_INTERNAL_URL: "${IMMICH_INTERNAL_URL:-http://immich-server:2283}"
      IMMICH_PUBLIC_URL: "${IMMICH_PUBLIC_URL:-}"
      DOCUMENT_PUBLIC_URL: "${DOCUMENT_PUBLIC_URL:-${APP_PUBLIC_SCHEME}://document.${BASE_DOMAIN}}"
      ONLYOFFICE_JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-}"
      DOCKER_PUBLIC_URL: "${DOCKER_PUBLIC_URL:-${APP_PUBLIC_SCHEME}://docker.${BASE_DOMAIN}}"
      DAWARICH_PUBLIC_URL: "${DAWARICH_PUBLIC_URL:-${APP_PUBLIC_SCHEME}://dawarich.${BASE_DOMAIN}}"
      APP_DB_CONFIG: /opt/AppDashboard/data/db.env
      APPDATA_DATA_DIR: /opt/AppDashboard/data
      APP_DB_SKIP_SESSION_INIT: "1"
      APPDATA_BASE_DIR: /opt/ApplicationData
      UPLOADS_BASE_DIR: /opt/ApplicationData/dashboard/uploads
      DB_HOST: "${DB_HOST:-appdashboard-db}"
      DB_PORT: "5432"
      DB_NAME: appdashboard
      DB_USER: appdashboard
      DB_PASSWORD: "${DB_PASSWORD:-appdashboard_dev_password}"
      REDIS_HOST: appdashboard-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PREFIX: "appdashboard:"
      PY_SIDECAR_URL: "${PY_SIDECAR_URL:-http://appdashboard-py:8100}"
      TINYTEX_HOME: /opt/ApplicationData/tinytex
      RUN_ENSURE_TINYTEX: "${RUN_ENSURE_TINYTEX:-0}"
      RUN_STARTUP_DEPS: "1"
      RUN_MCP_PACKAGE_BUILD: "1"
      APP_WAF_RULE_ENGINE: "${APP_WAF_RULE_ENGINE:-On}"
      PHP_OPCACHE_ENABLE: "1"
      COMPOSER_PROCESS_TIMEOUT: "3600"
      SSH_WS_PORT: "8765"
      SSH_WS_BIND: 127.0.0.1
      SSH_DEFAULT_HOST: "${SSH_DEFAULT_HOST:-host.docker.internal}"
      SSH_DEFAULT_USER: "${SSH_DEFAULT_USER:-root}"
      SSH_DEFAULT_PORT: "${SSH_DEFAULT_PORT:-22}"
      SMART_HOME_WS_PORT: "8766"
      SMART_HOME_WS_BIND: 127.0.0.1
      # Per-user storage usage collector (Admin Panel → Statistics chart).
      # External app databases usually live in the host PostgreSQL (host.docker.internal:5432).
      STORAGE_USAGE_ENABLED: "${STORAGE_USAGE_ENABLED:-1}"
      STORAGE_USAGE_INTERVAL: "${STORAGE_USAGE_INTERVAL:-900}"
      STORAGE_USAGE_DB_HOST: "${STORAGE_USAGE_DB_HOST:-host.docker.internal}"
      STORAGE_USAGE_DB_PORT: "${STORAGE_USAGE_DB_PORT:-5432}"
      STORAGE_USAGE_TIMEOUT_MS: "${STORAGE_USAGE_TIMEOUT_MS:-20000}"
      STORAGE_USAGE_IMMICH_DB: "${STORAGE_USAGE_IMMICH_DB:-immich}"
      STORAGE_USAGE_IMMICH_DB_USER: "${STORAGE_USAGE_IMMICH_DB_USER:-postgres}"
      STORAGE_USAGE_IMMICH_DB_PASSWORD: "${STORAGE_USAGE_IMMICH_DB_PASSWORD:-${IMMICH_DB_PASSWORD:-}}"
      STORAGE_USAGE_GITEA_DB: "${STORAGE_USAGE_GITEA_DB:-gitea}"
      STORAGE_USAGE_GITEA_DB_USER: "${STORAGE_USAGE_GITEA_DB_USER:-gitea}"
      STORAGE_USAGE_GITEA_DB_PASSWORD: "${STORAGE_USAGE_GITEA_DB_PASSWORD:-${GITEA_DB_PASSWORD:-}}"
      STORAGE_USAGE_DAWARICH_DB: "${STORAGE_USAGE_DAWARICH_DB:-dawarich_development}"
      STORAGE_USAGE_DAWARICH_DB_USER: "${STORAGE_USAGE_DAWARICH_DB_USER:-postgres}"
      STORAGE_USAGE_DAWARICH_DB_PASSWORD: "${STORAGE_USAGE_DAWARICH_DB_PASSWORD:-${DAWARICH_DB_PASSWORD:-}}"
      # Integrated restic backup manager: host filesystem is mounted read-write
      # so backups and restores can cover the host, not just the container.
      RESTIC_HOST_ROOT: "/host"
      # Docker Desktop serves /home through virtiofs, which cannot hold a restic
      # repo (hundreds of data/ dirs exhaust the share). Bind the host home directly.
      RESTIC_BIND_HOME: "/host-home"
      RESTIC_BIND_HOME_PREFIX: "${HOME:-/home/ihor}"
    # Go's copy_file_range returns EIO on Docker Desktop fakeowner mounts and
    # restic then skips every host file. ENOSYS makes Go fall back to read().
    security_opt:
      - seccomp:./deploy/seccomp-restic.json
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:8808:8808"
    volumes:
      - .:/var/www/AppDashboard
      - .:/var/www/apps-dashboard
      - ./nginx/appdashboard.conf.template:/etc/nginx/templates/appdashboard.conf.template:ro
      - appdashboard-data:/opt/AppDashboard/data
      - appdashboard-appdata:/opt/ApplicationData
      - appdashboard-logs:/var/log/nginx
      - appdashboard-logs:/var/log/bot
      - appdashboard-waf-logs:/var/log/modsecurity
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
      - ${HOME:-/home/ihor}:/host-home
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host-gateway:host-gateway"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    profiles: ["portainer"]
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    profiles: ["gitea"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      USER_UID: "${GITEA_UID:-1000}"
      USER_GID: "${GITEA_GID:-1000}"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: "${GITEA_DB_PASSWORD:-gitea_dev_password}"
      GITEA__server__ROOT_URL: "${GITEA_EMBED_URL:-${APP_PUBLIC_BASE_URL:-http://localhost}/embed/git/}"
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data
    depends_on:
      gitea-db:
        condition: service_healthy

  gitea-db:
    image: postgres:16
    container_name: gitea-db
    restart: unless-stopped
    profiles: ["gitea"]
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: "${GITEA_DB_PASSWORD:-gitea_dev_password}"
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    profiles: ["immich"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: "${IMMICH_DB_PASSWORD:-immich_dev_password}"
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - immich-uploads:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-db:
        condition: service_healthy

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    profiles: ["immich"]
    volumes:
      - immich-model-cache:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    profiles: ["immich"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-db
    restart: unless-stopped
    profiles: ["immich"]
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD:-immich_dev_password}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5

  dawarich:
    image: freikin/dawarich:latest
    container_name: dawarich
    restart: unless-stopped
    profiles: ["dawarich"]
    command: ["bin/rails", "server", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "${DAWARICH_DB_PASSWORD:-dawarich_dev_password}"
      DATABASE_NAME: dawarich_development
      APPLICATION_HOSTS: "${DAWARICH_HOSTS:-localhost,127.0.0.1,::1,dawarich.${BASE_DOMAIN:-localhost},${BASE_DOMAIN:-localhost}}"
      APPLICATION_PROTOCOL: "${APP_PUBLIC_SCHEME:-http}"
      SECRET_KEY_BASE: "${DAWARICH_SECRET_KEY_BASE:-change_me_change_me_change_me_change_me}"
      SELF_HOSTED: "true"
    ports:
      - "${DAWARICH_PORT:-3002}:3000"
    volumes:
      - dawarich-public:/var/app/public
      - dawarich-storage:/var/app/storage
      - dawarich-watched:/var/app/tmp/imports/watched
    depends_on:
      dawarich-db:
        condition: service_healthy
      dawarich-redis:
        condition: service_healthy

  dawarich-sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich-sidekiq
    restart: unless-stopped
    profiles: ["dawarich"]
    command: ["bundle", "exec", "sidekiq"]
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: "${DAWARICH_DB_PASSWORD:-dawarich_dev_password}"
      DATABASE_NAME: dawarich_development
      SECRET_KEY_BASE: "${DAWARICH_SECRET_KEY_BASE:-change_me_change_me_change_me_change_me}"
      SELF_HOSTED: "true"
    volumes:
      - dawarich-public:/var/app/public
      - dawarich-storage:/var/app/storage
      - dawarich-watched:/var/app/tmp/imports/watched
    depends_on:
      dawarich:
        condition: service_started

  dawarich-db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich-db
    restart: unless-stopped
    profiles: ["dawarich"]
    environment:
      POSTGRES_DB: dawarich_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DAWARICH_DB_PASSWORD:-dawarich_dev_password}"
    volumes:
      - dawarich-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawarich_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  dawarich-redis:
    image: redis:7-alpine
    container_name: dawarich-redis
    restart: unless-stopped
    profiles: ["dawarich"]
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  appdashboard-logs:
  appdashboard-waf-logs:
  appdashboard-data:
  appdashboard-appdata:
  appdashboard-db-data:
  appdashboard-redis-data:
  portainer-data:
  gitea-data:
  gitea-db-data:
  immich-uploads:
  immich-model-cache:
  immich-db-data:
  dawarich-public:
  dawarich-storage:
  dawarich-watched:
  dawarich-db-data:
