# --- False positives on the dashboard's own front-end assets -------------------
#
# The dashboard serves one large HTML document per route that embeds the whole
# UI: CSS, inline JavaScript and the translation dictionary. The CRS RESPONSE
# data-leakage rules scan that body and match text that the application itself
# ships:
#
#   920350  "Host header is a numeric IP address"  - the dashboard is normally
#           reached via a bare IP (http://10.0.0.5:8080), so the Host header is
#           numeric by design. Score 3.
#   951240  "postgres SQL Information Leakage"     - the recipes translation
#           helper embeds a JS comment showing a PostgreSQL timestamp format
#           ("PostgreSQL may return \"2026-10-19 20:34:38.280345+00\"").
#           The signature matches that literal string. Score 5.
#   953100  "PHP Information Leakage"               - the translation JSON blob
#           contains keys such as "php_info"/"php_version" used by the UI to
#           show the server version panel. Score 3.
#
# Together they reach TX:OUTBOUND_ANOMALY_SCORE=9, which trips rule 959100
# ("Outbound Anomaly Score Exceeded"). That rule runs in phase 4, after PHP
# already produced the body: nginx then discarded the finished response and
# replaced it with a 403 page *mid-stream*, so clients saw an aborted chunked
# response (requests: ChunkedEncodingError) instead of a clean 403.
#
# These signatures only make sense against a server that leaks its own
# internals to an anonymous visitor. The dashboard's HTML is the same for every
# visitor and already authenticated users, so removing these three RESPONSE
# rules costs no protection while removing the broken-response bug.
# NOTE: ctl:ruleRemoveById takes a single id (or a range) - a semicolon
# separated list is not parsed and would remove nothing. One rule per id.
SecRule REQUEST_URI "@rx ^/" "id:100090,phase:1,pass,nolog,ctl:ruleRemoveById=920350"
SecRule REQUEST_URI "@rx ^/" "id:100091,phase:1,pass,nolog,ctl:ruleRemoveById=951240"
SecRule REQUEST_URI "@rx ^/" "id:100092,phase:1,pass,nolog,ctl:ruleRemoveById=953100"

# --- Response body inspection -------------------------------------------------
#
# The dashboard is a single-page application: every route serves one large HTML
# document (the /login document alone is ~790 KB) that embeds the CSS, the
# inline JavaScript and the whole translation dictionary. ModSecurity's
# SecResponseBodyMimeType includes text/html, so the RESPONSE data-leakage
# rules (951xxx, 953xxx) were scanning that entire body on every single
# request.
#
# Two consequences were measured on this deployment:
#
#   1. CPU: nginx worker processes consumed ~230 % CPU while php-fpm consumed
#      only ~40 %. Dropping text/html from the inspected mime types brought the
#      nginx workers down to ~27 % CPU for the same request rate.
#   2. Correctness: a false positive in phase 4 (rule 959100, "Outbound
#      Anomaly Score Exceeded") makes nginx drop the response body it had
#      already buffered from PHP and emit a 403 page in its place. Because the
#      body is streamed with Transfer-Encoding: chunked, the client received a
#      truncated response ("InvalidChunkLength"/ChunkedEncodingError) instead
#      of a clean 403.
#
# The RESPONSE data-leakage rules exist to catch a server that leaks its own
# source code, config files or SQL errors to an anonymous visitor. The
# dashboard's HTML is static application code served identically to every
# visitor and is authenticated for everything that matters, so scanning it
# provides no security benefit while costing most of the server's CPU and
# producing broken responses.
#
# Restricting response body inspection to non-HTML payloads keeps the useful
# part of the rule set (JSON/XML error payloads, stack traces in API answers)
# while removing the HTML bottleneck.
# NOTE: SecRuleEngine is deliberately NOT set here. This file is included
# after appdashboard-engine.conf, so setting it here would override the
# operator-facing On/DetectionOnly/Off switch.
SecResponseBodyMimeType text/plain application/json application/xml text/xml
