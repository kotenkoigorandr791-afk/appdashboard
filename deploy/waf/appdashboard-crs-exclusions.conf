# The cloud AI assistant (and the recipes / news AI generators) post arbitrary
# user text as JSON: prose, prompts, Markdown, code samples, SQL snippets. The
# CRS signature rules match that content by design.
#
# Disabling only request-body inspection was not enough: the RESPONSE body rules
# stayed armed, so in phase 4 ModSecurity raised TX:OUTBOUND_ANOMALY_SCORE
# (rule 959100) on the generated AI answer and nginx discarded the already
# produced body, replacing it with a 403 HTML page mid-request. The browser then
# saw an aborted/broken response and the UI reported "network error" /
# "The AI gateway is temporarily unavailable (HTTP 403)".
#
# The previous exclusion also listed rule ids separated by semicolons inside a
# single ctl:ruleRemoveById, which ModSecurity does not parse as a list (it takes
# one id or a range), so it removed nothing.
#
# Fix: for these AI endpoints disable BOTH request and response body inspection.
# NOTE: this ModSecurity build (libmodsecurity 3.0.9) does NOT implement the
# ctl:responseBodyAccess action (nginx -t fails with "Expecting an action, got:
# ctl:responseBodyAccess=Off"), so the equivalent is used: a phase:4 rule that
# switches the rule engine off before the CRS response rules (included after this
# file) are evaluated. AI output legitimately contains code/SQL/HTML-like text
# that CRS flags by design. These endpoints are already session-authenticated in
# PHP, so body inspection buys nothing.
SecRule REQUEST_URI "@beginsWith /apps/cloud/ai.php" "id:1000260,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
SecRule REQUEST_URI "@beginsWith /apps/recipes/recipes_ai.php" "id:1000261,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
SecRule REQUEST_URI "@rx ^/main\?api=news&action=" "id:1000262,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
# Disable the CRS response (outbound) rules for the AI endpoints. These rules run
# in phase 4; because this file is included before the CRS rule files, these
# rules are evaluated first and turn the engine off for the remaining phase-4
# rules, so the generated AI response body is never discarded/replaced by 403.
SecRule REQUEST_URI "@beginsWith /apps/cloud/ai.php" "id:1000263,phase:4,pass,nolog,ctl:ruleEngine=Off"
SecRule REQUEST_URI "@beginsWith /apps/recipes/recipes_ai.php" "id:1000264,phase:4,pass,nolog,ctl:ruleEngine=Off"
SecRule REQUEST_URI "@rx ^/main\?api=news&action=" "id:1000265,phase:4,pass,nolog,ctl:ruleEngine=Off"
SecRule REQUEST_URI "@beginsWith /apps/cloud/api.php" "id:100021,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:content,ctl:ruleRemoveTargetById=941100;ARGS:message,ctl:ruleRemoveTargetById=942100;ARGS:content,ctl:ruleRemoveTargetById=942100;ARGS:message"
