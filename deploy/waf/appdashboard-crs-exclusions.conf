# LaTeX editor: the document body (ARGS:content / ARGS:latex) and the translation
# source (ARGS:text) are user-supplied LaTeX. Math like $L_{mn}$ or
# $(20n+30m)/\mathrm{Lp}$, command sequences such as \cdot, and preamble blocks
# containing "python"/"fi" match the RCE and PHP-injection signatures by design,
# which pushed the inbound anomaly score past the blocking threshold.
# Endpoint is already session-authenticated in PHP (cloud_require_session_auth),
# so only these specific rules on these specific args are excluded here; every
# other rule - including the 949110/959100 blocking evaluation - stays armed.
# Rule ids are per-arg on separate lines: a single SecRule only honours a bounded
# number of ctl:ruleRemoveTargetById actions, and the URI regex must not be
# anchored with $ because REQUEST_URI carries the query string.
SecRule REQUEST_URI "@rx ^/apps/cloud/utilities/projects/latex-editor/public/index\.php(\?|$)" "id:100061,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932100;ARGS:content"
SecRule REQUEST_URI "@rx ^/apps/cloud/utilities/projects/latex-editor/public/index\.php(\?|$)" "id:100062,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932100;ARGS:latex"
