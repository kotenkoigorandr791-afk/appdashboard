# The cloud AI assistant (and the recipes / news AI generators) post arbitrary
# user text as JSON: prose, prompts, Markdown, code samples, SQL snippets. The
# CRS signature rules match that content by design, so the anomaly score crossed
# the blocking threshold and nginx answered with a plain 403 HTML page. The UI
# surfaced that as "The AI gateway is temporarily unavailable (HTTP 403)".
#
# The previous exclusion listed rule ids separated by semicolons inside a single
# ctl:ruleRemoveById, which ModSecurity does not parse as a list (it takes one id
# or a range), so it removed nothing and the 403s continued. These endpoints are
# already session-authenticated in PHP, so skip request-body inspection for them
# only; URI, header and (for streaming) response rules stay armed.
SecRule REQUEST_URI "@beginsWith /apps/cloud/ai.php" "id:100020,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
SecRule REQUEST_URI "@beginsWith /apps/recipes/recipes_ai.php" "id:1000201,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
SecRule REQUEST_URI "@rx ^/main\?api=news&action=" "id:1000202,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
SecRule REQUEST_URI "@beginsWith /apps/cloud/api.php" "id:100021,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:content,ctl:ruleRemoveTargetById=941100;ARGS:message,ctl:ruleRemoveTargetById=942100;ARGS:content,ctl:ruleRemoveTargetById=942100;ARGS:message"
# save_file posts user source code in ARGS:content (scripts with shebangs, PHP/JS/HTML).
# The RCE/XSS signatures below match that code by design, so exclude them for this arg
# only. Every other arg and endpoint stays fully protected by the CRS.
SecRule REQUEST_URI "@beginsWith /apps/cloud/api.php" "id:100022,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932100;ARGS:content"
