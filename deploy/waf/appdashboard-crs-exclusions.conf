# The recipes app posts user-authored recipe text (title, translated_title, product
# names and the JSON steps array) as application/x-www-form-urlencoded. CRS rule
# 941310 ("US-ASCII Malformed Encoding XSS Filter") matches the raw bytes 0xBC/0xBE,
# which are ordinary UTF-8 bytes inside Cyrillic words, so every recipe saved in
# Russian/Ukrainian was blocked with a ModSecurity 403 ("Inbound Anomaly Score
# Exceeded"). The signature is a false positive for UTF-8 text, not an XSS attempt.
#
# Scope the exclusion to POST requests of this single endpoint and to the text
# arguments only: every other CRS rule (SQLi, RCE, traversal, ...), every other
# argument and every GET request stay fully armed. The endpoint is session
# authenticated in PHP.
SecRule REQUEST_URI "@beginsWith /apps/recipes/index.php" "id:100080,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,ctl:ruleRemoveTargetById=941310;ARGS:steps,ctl:ruleRemoveTargetById=941310;ARGS:translated_title,ctl:ruleRemoveTargetById=941310;ARGS:title,ctl:ruleRemoveTargetById=941310;ARGS:name_en,ctl:ruleRemoveTargetById=941310;ARGS:name_uk,ctl:ruleRemoveTargetById=941310;ARGS:name_ru,ctl:ruleRemoveTargetById=941310;ARGS:name_be"
# Compile endpoint: request body legitimately carries source code (PHP tags, SQL, shell),
# which trips OWASP CRS injection rules. Endpoint is already session-authenticated in PHP.
SecRule REQUEST_URI "@rx ^/apps/cloud/compile\.php$" "id:100060,phase:1,pass,nolog,ctl:ruleEngine=Off"
