Include /etc/modsecurity/modsecurity.conf
Include /etc/nginx/modsecurity/appdashboard-engine.conf
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=7,setvar:tx.outbound_anomaly_score_threshold=8"
SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE PROPFIND PROPPATCH MKCOL COPY MOVE LOCK UNLOCK'"
SecAction "id:900990,phase:1,nolog,pass,t:none,setvar:tx.crs_setup_version=400"
Include /etc/nginx/modsecurity/appdashboard-crs-exclusions.conf
Include /etc/nginx/modsecurity/owasp-crs.load
