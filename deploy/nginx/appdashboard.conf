map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map "$scheme:$http_x_forwarded_proto" $is_secure_conn {
    https:         1;
    https:https    1;
    http:https     1;
    default        0;
}
map $is_secure_conn $hsts_header {
    1 "max-age=31536000; includeSubDomains";
    default "";
}
map $is_secure_conn $uir_token {
    1 "upgrade-insecure-requests";
    default "";
}
limit_req_zone $binary_remote_addr zone=appdashboard_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=appdashboard_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=appdashboard_admin:10m rate=30r/m;
limit_req_status 429;



server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;
    include /opt/docker/appdashboard/nginx/cloudflare-realip.conf;
    client_max_body_size 64m;
    access_log /var/log/nginx/omniroute_access.log;
    error_log /var/log/nginx/omniroute_error.log warn;
    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/AppDashboard;
    index index.php index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain text/xml application/xml font/ttf font/otf application/wasm;

    access_log /var/log/nginx/appdashboard_access.log;
    error_log  /var/log/nginx/appdashboard_error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), usb=(), clipboard-write=*, clipboard-read=*" always;
    add_header Strict-Transport-Security "$hsts_header" always;

    if ($request_uri ~* "^(.*/)index\.(php|html?)$") {
        return 301 $1;
    }

    location = /google7cb515c0a41e4548.html { }

    location ~ ^/(uploads|apps/cloud/storage|apps/cloud/temp|apps/cloud/temp_convert|apps/cloud/transcription_uploads|apps/cloud/tts_output|apps/cloud/upload_sessions|apps/cloud/data|apps/films/comments|apps/spends/backups|apps/steps/users|apps/spends/users|apps/kanboard/data)/.*\.(php|php3|php4|php5|php7|php8|phtml|phar|phps|pht|phtm|inc|cgi|pl|py|rb|jsp|asp|aspx)$ {
        return 403;
    }

    location ~ ^/(\.git|\.svn|\.hg|\.cursor|\.venv|\.Trash-1000|\.security_backups)(/|$) {
        return 403;
    }

    location ~ /vendor/ { return 403; }
    location ~ /node_modules/ { return 403; }

    location ~ \.(sqlite|sqlite3|db|db3|sqlitedb)$ { return 403; }
    location ~ ^/data/.*\.sqlite3$ { return 403; }
    location ~ ^/db/.*\.sqlite3$ { return 403; }
    location ~ ^/database/.*\.sqlite3$ { return 403; }

    location ^~ /data/.ssh/ { deny all; }

    location ^~ /.well-known/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(login/oauth/authorize|login/oauth/access_token|api/v1/user|api/v1/user/emails|plane-oauth/login/oauth/authorize|plane-oauth/login/oauth/access_token|plane-oauth/api/v1/user|plane-oauth/api/v1/user/emails)$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location = /webdav {
        client_max_body_size 0;
        fastcgi_request_buffering off;
        gzip off;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 86400;
        fastcgi_send_timeout 86400;
        fastcgi_param SCRIPT_FILENAME $document_root/apps/cloud/webdav.php;
        fastcgi_param SCRIPT_NAME /webdav;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /webdav/ {
        client_max_body_size 0;
        fastcgi_request_buffering off;
        gzip off;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 86400;
        fastcgi_send_timeout 86400;
        fastcgi_param SCRIPT_FILENAME $document_root/apps/cloud/webdav.php;
        fastcgi_param SCRIPT_NAME /webdav;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. { deny all; }

    location ~* \.(htaccess|htpasswd|ini|log|sh|bak|sql|env|zip|tar|gz|tgz|7z|bz2|rar|swp|swo|orig|backup|old|dist|lock|yml|yaml)$ {
        deny all;
    }

    location = /cpp_solver.zip { }
    location = /v13.54.34.z1.zip { }
    location ^~ /mcp/ {
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /mcp-api/ {
        proxy_pass http://127.0.0.1:8808/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ~ ^/performance/(cpu|mem|memswap|diskio|network|uptime)/?$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/project/performance/server_monitor.php;
        fastcgi_param QUERY_STRING endpoint=$1&$query_string;
        fastcgi_hide_header X-Powered-By;
    }

    location = /terms {
        rewrite ^ /terms.html last;
    }
    location = /privacy {
        rewrite ^ /privacy.html last;
    }
    location = /main {
        limit_req zone=appdashboard_admin burst=40 nodelay;
        rewrite ^ /index.php last;
    }
    location = /login {
        limit_req zone=appdashboard_auth burst=20 nodelay;
        rewrite ^ /index.php last;
    }
    location ^~ /login/oauth/ {
        rewrite ^ /index.php last;
    }
    location = /register {
        limit_req zone=appdashboard_auth burst=20 nodelay;
        rewrite ^ /index.php last;
    }
    location = /api/client-auth {
        rewrite ^ /index.php?api=client_auth last;
    }

    location ^~ /public-api/ {
        limit_req zone=appdashboard_api burst=120 nodelay;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
