per_listener_settings false
persistence true
# Broker state and credentials live on the APPDATA volume (see docker-entrypoint.sh),
# never in the container layer.
persistence_location /opt/ApplicationData/mosquitto/
max_queued_messages 1000
max_inflight_messages 20
allow_anonymous false
password_file /opt/ApplicationData/mosquitto/smarthome.passwd
acl_file /opt/ApplicationData/mosquitto/smarthome.acl
listener 1883 127.0.0.1
listener 9001 127.0.0.1
protocol websockets
