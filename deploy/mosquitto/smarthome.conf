per_listener_settings false
persistence true
# Runtime paths must stay under AppArmor-allowed locations for
# /usr/sbin/mosquitto (host profile allows /etc/mosquitto and
# /var/lib/mosquitto/mosquitto.db only). Durable copies live on
# APPDATA and are synced by docker-entrypoint.sh / mqtt_auth_sync.php.
persistence_location /var/lib/mosquitto/
max_queued_messages 1000
max_inflight_messages 20
allow_anonymous false
password_file /etc/mosquitto/smarthome.passwd
acl_file /etc/mosquitto/smarthome.acl
listener 1883 127.0.0.1
listener 9001 127.0.0.1
protocol websockets
