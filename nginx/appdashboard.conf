map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/AppDashboard;
    index index.php index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain text/xml application/xml font/ttf font/otf application/wasm;

    access_log /var/log/nginx/appdashboard_access.log;
    error_log  /var/log/nginx/appdashboard_error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self), usb=()" always;

    if ($request_uri ~* "^(.*/)index\.(php|html?)$") {
        return 301 $1;
    }

    location = /google7cb515c0a41e4548.html { }

    location ~ ^/(uploads|apps/cloud/storage|apps/cloud/temp|apps/cloud/temp_convert|apps/cloud/transcription_uploads|apps/cloud/tts_output|apps/cloud/upload_sessions|apps/cloud/data|apps/map/uploads|apps/map/location_photos|apps/map/user_data|apps/films/comments|apps/spends/backups|apps/steps/users|apps/spends/users)/.*\.(php|php3|php4|php5|php7|php8|phtml|phar|phps|pht|phtm|inc|cgi|pl|py|rb|jsp|asp|aspx)$ {
        return 403;
    }

    location ~ ^/(\.git|\.svn|\.hg|\.cursor|\.venv|\.Trash-1000|\.security_backups)(/|$) {
        return 403;
    }

    location ~ /vendor/ { return 403; }
    location ~ /node_modules/ { return 403; }

    location ~ \.(sqlite|sqlite3|db|db3|sqlitedb)$ { return 403; }
    location ~ ^/data/.*\.sqlite3$ { return 403; }
    location ~ ^/db/.*\.sqlite3$ { return 403; }
    location ~ ^/database/.*\.sqlite3$ { return 403; }

    location ^~ /data/.ssh/ { deny all; }

    location ^~ /apps/lopaka/ {
        try_files $uri $uri/ /apps/lopaka/index.html;
    }

    location ^~ /.well-known/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /webdav {
        client_max_body_size 0;
        fastcgi_request_buffering off;
        gzip off;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 86400;
        fastcgi_send_timeout 86400;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /webdav/ {
        client_max_body_size 0;
        fastcgi_request_buffering off;
        gzip off;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 86400;
        fastcgi_send_timeout 86400;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. { deny all; }

    location ~* \.(htaccess|htpasswd|ini|log|sh|bak|sql|env|zip|tar|gz|tgz|7z|bz2|rar|swp|swo|orig|backup|old|dist|lock|yml|yaml)$ {
        deny all;
    }

    location = /cpp_solver.zip { }
    location = /v13.54.34.z1.zip { }
    location ^~ /mcp/ {
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /mcp-api/ {
        proxy_pass http://127.0.0.1:8808/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location ~ ^/performance/(cpu|mem|memswap|diskio|network|uptime)/?$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/apps/performance/server_monitor.php;
        fastcgi_param QUERY_STRING endpoint=$1&$query_string;
        fastcgi_hide_header X-Powered-By;
    }

    location = /map/api/token {
        rewrite ^ /apps/map/index.php last;
    }
    location = /map/api/tokens {
        rewrite ^ /apps/map/index.php last;
    }
    location = /map/api/location {
        rewrite ^ /apps/map/index.php last;
    }

    location = /terms {
        rewrite ^ /terms.html last;
    }
    location = /privacy {
        rewrite ^ /privacy.html last;
    }
    location = /main {
        rewrite ^ /index.php last;
    }
    location = /login {
        rewrite ^ /index.php last;
    }
    location = /login/oauth/start {
        rewrite ^ /index.php last;
    }
    location = /login/oauth/callback {
        rewrite ^ /index.php last;
    }
    location = /register {
        rewrite ^ /index.php last;
    }
    location = /api/client-auth {
        rewrite ^ /index.php?api=client_auth last;
    }

    location ^~ /public-api/ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/public-api/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /admin-omniroute/ {
        absolute_redirect off;
        proxy_pass https://ai.serverkherson.xyz/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ai.serverkherson.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect ~^https?://ai\.serverkherson\.xyz(/.*)$ /admin-omniroute$1;
        proxy_redirect ~^http://serverkherson\.xyz(/.*)$ https://serverkherson.xyz$1;
        proxy_redirect ~^(/.*)$ /admin-omniroute$1;
        proxy_cookie_path / /;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: ws: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://static.cloudflareinsights.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
        sub_filter_once off;
        sub_filter 'http://serverkherson.xyz/home/' 'https://serverkherson.xyz/admin-omniroute/home/';
        sub_filter 'http://serverkherson.xyz/home' 'https://serverkherson.xyz/admin-omniroute/home';
    }

    location ^~ /_next/ {
        proxy_pass https://ai.serverkherson.xyz/_next/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ai.serverkherson.xyz;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # Local steps ingest alias — route to the PHP app before the generic
    # /api/ proxy below (longest-prefix match wins).
    location ^~ /api/steps {
        rewrite ^/api(/.*)$ /public-api$1 break;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/public-api/index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /api/ {
        proxy_pass https://ai.serverkherson.xyz/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ai.serverkherson.xyz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location = /home {
