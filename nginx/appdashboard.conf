map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Only force HTTPS on responses the client actually received over HTTPS.
# VPN/LAN access over plain HTTP must not get HSTS or upgrade-insecure-requests,
# otherwise the browser upgrades every style/script to https: and the page loads unstyled.
map "$scheme:$http_x_forwarded_proto" $is_secure_conn {
    https:         1;
    https:https    1;
    http:https     1;
    default        0;
}
map $is_secure_conn $hsts_header {
    1 "max-age=31536000; includeSubDomains";
    default "";
}
map $is_secure_conn $uir_token {
    1 "upgrade-insecure-requests";
    default "";
}
limit_req_zone $binary_remote_addr zone=appdashboard_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=appdashboard_api:10m rate=120r/m;
