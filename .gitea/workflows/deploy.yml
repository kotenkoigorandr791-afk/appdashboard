name: Deploy AppDashboard
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-images:
    runs-on: appdashboard-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and push Docker images
        run: |
          set -euo pipefail
          mkdir -p downloads
          releases="$(curl -fsS -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" "https://git.serverkherson.xyz/api/v1/repos/kotenkoigorandr791/apps-dashboard/releases?limit=50")"
          release="$(printf '%s' "$releases" | jq -c '[.[] | select(.tag_name | startswith("steps-v"))] | sort_by(.created_at) | last')"
          apk_url="$(printf '%s' "$release" | jq -r '.assets[] | select(.name == "stepmonitor.apk") | .browser_download_url')"
          metadata_url="$(printf '%s' "$release" | jq -r '.assets[] | select(.name == "stepmonitor.json") | .browser_download_url')"
          test -n "$apk_url" -a "$apk_url" != null
          test -n "$metadata_url" -a "$metadata_url" != null
          curl -fsSL -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" "$apk_url" -o downloads/stepmonitor.apk
          curl -fsSL -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" "$metadata_url" -o downloads/stepmonitor.json
          if [ -n '${{ secrets.DOCKERHUB_TOKEN }}' ]; then
            printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login --username '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          fi
          # VERSION holds major.minor (e.g. 1.0); the patch is the commit count,
          # so every built image gets a monotonically growing semver.
          VERSION_BASE="$(tr -dc '0-9.' < VERSION | head -n 1)"
          VERSION_MAJOR_MINOR="${VERSION_BASE%.*}"
          [ -n "$VERSION_MAJOR_MINOR" ] || VERSION_MAJOR_MINOR="1.0"
          APP_VERSION="$VERSION_MAJOR_MINOR.$(git rev-list --count HEAD)"
          APP_GIT_COMMIT="$(git rev-parse HEAD)"
          APP_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build -f Dockerfile --build-arg APP_VERSION="$APP_VERSION" --build-arg APP_GIT_COMMIT="$APP_GIT_COMMIT" --build-arg APP_BUILD_DATE="$APP_BUILD_DATE" -t ihorkotenko/appdashboard:latest .
          docker build -f deploy/python-sidecar/Dockerfile -t ihorkotenko/appdashboard-py:latest .
          docker push ihorkotenko/appdashboard:latest
          docker push ihorkotenko/appdashboard-py:latest

  deploy-main:
    runs-on: appdashboard-deploy
    needs: build-images
    steps:
      - name: Deploy main
        run: |
          set -euo pipefail
          cd /opt/docker/appdashboard/code
          sudo chown -hR "$(id -u):$(id -g)" /opt/docker/appdashboard/code
          git fetch origin main
          if docker inspect appdashboard >/dev/null 2>&1; then
            docker exec appdashboard sh -c 'mkdir -p /opt/ApplicationData/films; for name in movies.json config.json; do src="/var/www/AppDashboard/apps/films/$name"; target="/opt/ApplicationData/films/$name"; if [ -f "$src" ] && [ ! -f "$target" ]; then cp -a "$src" "$target"; fi; done'
          fi
          if [ "$(git branch --show-current)" != "main" ]; then
            git checkout main
          fi
          git reset --hard origin/main
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short --untracked-files=no
            echo "Working tree has uncommitted tracked changes; commit or stash server changes before deploy."
            exit 1
          fi
          # Load host env before rendering any nginx config: the front door runs on
          # the host and needs BASE_DOMAIN/APP_PUBLIC_SCHEME plus published ports.
          set -a
          [ -f /opt/docker/appdashboard/.env ] && . /opt/docker/appdashboard/.env
          set +a
          export BASE_DOMAIN="${BASE_DOMAIN:-serverkherson.xyz}"
          export APP_PUBLIC_SCHEME="${APP_PUBLIC_SCHEME:-https}"
          export GITEA_PROXY_HOST="${GITEA_PROXY_HOST:-git.${BASE_DOMAIN}}"
          export IMMICH_PROXY_HOST="${IMMICH_PROXY_HOST:-photo.${BASE_DOMAIN}}"
          sudo -E sh /opt/docker/appdashboard/code/deploy/scripts/install-maintenance-stub.sh /opt/docker/appdashboard/code
          sudo -E env START_FRONT_DOOR=0 sh /opt/docker/appdashboard/code/deploy/scripts/install-front-door.sh /opt/docker/appdashboard/code
          sudo -E sh /opt/docker/appdashboard/code/deploy/scripts/maintenance-flag.sh on
          trap 'sudo sh /opt/docker/appdashboard/code/deploy/scripts/maintenance-flag.sh off || true' EXIT
          # Rebuild Lopaka locally when its sources changed between deploys.
          # Sources are vendored in apps/lopaka/src; no GitHub fetch involved.
          if [ -f deploy/scripts/lopaka-needs-build.sh ]; then
            sh deploy/scripts/lopaka-needs-build.sh && sh deploy/scripts/build-lopaka.sh . || true
          fi
          docker compose -f /opt/docker/appdashboard/docker-compose.yml -f /opt/docker/appdashboard/docker-compose.prod.yml pull appdashboard appdashboard-py
          docker compose -f /opt/docker/appdashboard/docker-compose.yml -f /opt/docker/appdashboard/docker-compose.prod.yml up -d --no-build --force-recreate appdashboard appdashboard-py
          sudo -E sh /opt/docker/appdashboard/code/deploy/scripts/install-front-door.sh /opt/docker/appdashboard/code
          docker exec appdashboard rm -f /var/www/AppDashboard/tg_mini_auth.php
          # Ensure public OAuth issuer uses https://$BASE_DOMAIN (never http://localhost).
          if [ -f /opt/docker/appdashboard/.env ]; then
            if grep -qE '^BASE_DOMAIN=(localhost)?[[:space:]]*$' /opt/docker/appdashboard/.env || ! grep -qE '^BASE_DOMAIN=' /opt/docker/appdashboard/.env; then
              grep -qE '^BASE_DOMAIN=' /opt/docker/appdashboard/.env \
                && sed -i 's/^BASE_DOMAIN=.*/BASE_DOMAIN=serverkherson.xyz/' /opt/docker/appdashboard/.env \
                || printf '\nBASE_DOMAIN=serverkherson.xyz\n' >> /opt/docker/appdashboard/.env
            fi
            if grep -qE '^APP_PUBLIC_SCHEME=' /opt/docker/appdashboard/.env; then
              sed -i 's/^APP_PUBLIC_SCHEME=.*/APP_PUBLIC_SCHEME=https/' /opt/docker/appdashboard/.env
            else
              printf '\nAPP_PUBLIC_SCHEME=https\n' >> /opt/docker/appdashboard/.env
            fi
            docker compose -f /opt/docker/appdashboard/docker-compose.yml -f /opt/docker/appdashboard/docker-compose.prod.yml up -d --no-build --force-recreate appdashboard appdashboard-py
          fi
          docker exec appdashboard php /var/www/AppDashboard/deploy/scripts/fix-public-urls.php || true
          docker exec appdashboard php /var/www/AppDashboard/deploy/scripts/ensure-oauth-integrations.php || true
          docker compose -f /opt/docker/appdashboard/docker-compose.yml up -d gitea 2>/dev/null || true
          docker exec appdashboard sh /var/www/AppDashboard/deploy/scripts/ensure-apps-appdata.sh /var/www/AppDashboard
          docker exec appdashboard sh /var/www/AppDashboard/deploy/scripts/ensure-container-packages.sh
          docker exec appdashboard /var/www/AppDashboard/bot/.venv/bin/pip install -q -r /var/www/AppDashboard/bot/requirements.txt
          docker exec appdashboard /var/www/AppDashboard/bot/.venv/bin/python3 -m py_compile /var/www/AppDashboard/bot/bot.py
          docker exec appdashboard php -l /var/www/AppDashboard/bot/bot_service.php
          docker exec appdashboard php -l /var/www/AppDashboard/bot/tg_mini_auth.php
          docker exec appdashboard composer install --no-dev --prefer-dist --no-interaction --working-dir=/var/www/AppDashboard/apps/cloud
          docker exec appdashboard php -l /var/www/AppDashboard/apps/smart_home/core/app.php
          docker exec appdashboard php -l /var/www/AppDashboard/apps/smart_home/SmartHomeWsHandler.php
          docker exec appdashboard chmod +x /var/www/AppDashboard/deploy/scripts/build-appdashboard-mcp.sh
          docker exec appdashboard sh /var/www/AppDashboard/deploy/scripts/build-appdashboard-mcp.sh /var/www/AppDashboard
          # StepMonitor APK is built outside appdashboard (see apps/steps/BUILD.md).
          test -f /opt/docker/appdashboard/code/downloads/appdashboard-mcp.tgz
          test -f /opt/docker/appdashboard/code/downloads/stepmonitor.apk
          docker exec appdashboard sh -c 'cd /var/www/AppDashboard && test "$(node -p "require(\"./appdashboard-mcp/package.json\").version")" = "$(node -p "require(\"./downloads/appdashboard-mcp.json\").version")"'
          export GITEA_INTERNAL_URL="${GITEA_INTERNAL_URL:-http://host.docker.internal:${GITEA_HTTP_PORT:-3001}}"
          export IMMICH_INTERNAL_URL="${IMMICH_INTERNAL_URL:-http://host.docker.internal:${IMMICH_PORT:-2283}}"
          python3 /opt/docker/appdashboard/code/deploy/scripts/render-nginx-conf.sh \
            /opt/docker/appdashboard/code/deploy/nginx/appdashboard.conf \
            /opt/docker/appdashboard/code/deploy/nginx/appdashboard.conf.rendered
          sudo cp /opt/docker/appdashboard/code/deploy/nginx/appdashboard.conf.rendered /opt/docker/appdashboard/nginx/sites-available-runtime.conf
          sudo sh /opt/docker/appdashboard/code/deploy/scripts/install-immich-theme-bridge-watch.sh
          sh /opt/docker/appdashboard/code/deploy/scripts/patch-immich-theme-bridge.sh
          docker exec appdashboard nginx -t
          docker restart appdashboard
          sudo sh /opt/docker/appdashboard/code/deploy/scripts/maintenance-flag.sh off
          sh /opt/docker/appdashboard/code/deploy/scripts/restart-container-workers.sh
          sudo sh /opt/docker/appdashboard/code/deploy/scripts/install-performance-monitor-service.sh
