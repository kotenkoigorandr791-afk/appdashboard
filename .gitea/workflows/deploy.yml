name: Deploy AppDashboard
on:
  push:
    branches:
      - main
jobs:
  deploy-main:
    if: gitea.ref == 'refs/heads/main'
    runs-on: appdashboard-deploy
    steps:
      - name: Deploy main
        run: |
          set -euo pipefail
          cd /opt/docker/appdashboard/code
          git fetch origin main
          git clean -f -- home/news.html
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Working tree is dirty; commit or stash server changes before deploy."
            exit 1
          fi
          if [ "$(git branch --show-current)" != "main" ]; then
            git checkout main
          fi
          git reset --hard origin/main
          docker compose -f /opt/docker/appdashboard/docker-compose.yml up -d --build appdashboard
          docker cp /opt/docker/appdashboard/code/deploy/nginx/appdashboard.conf appdashboard:/etc/nginx/sites-available/appdashboard.conf
          docker exec appdashboard nginx -t
          docker exec appdashboard nginx -s reload
  deploy-develop:
    if: gitea.ref == 'refs/heads/develop'
    runs-on: appdashboard-dev-deploy
    steps:
      - name: Deploy develop
        run: |
          set -euo pipefail
          cd /opt/docker/appdashboard/code
          git fetch origin develop
          git clean -f -- home/news.html
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "Working tree is dirty; commit or stash server changes before deploy."
            exit 1
          fi
          if git show-ref --verify --quiet refs/heads/develop; then
            git checkout develop
          else
            git checkout -b develop --track origin/develop
          fi
          git merge --ff-only origin/develop
          docker compose -f /opt/docker/appdashboard/docker-compose.yml up -d --build appdashboard
          docker cp /opt/docker/appdashboard/code/deploy/nginx/appdashboard.conf appdashboard:/etc/nginx/sites-available/appdashboard.conf
          docker exec appdashboard nginx -t
          docker exec appdashboard nginx -s reload
