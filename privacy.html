const themeLabels = {en: {light: "Light", dark: "Dark"}, ru: {light: "Светлая", dark: "Тёмная"}, uk: {light: "Світла", dark: "Темна"}, be: {light: "Светлая", dark: "Цёмная"}, pl: {light: "Jasny", dark: "Ciemny"}, cs: {light: "Světlý", dark: "Tmavý"}};
const languageSelect = document.getElementById("languageSelect"), themeToggle = document.getElementById("themeToggle"), themeLabel = document.getElementById("themeLabel"), themeDot = document.getElementById("themeDot"), backHomeBtn = document.getElementById("backHomeBtn");

// Function to validate a color
function isValidColor(color) {
    if (!color) return false;
    // HEX color check (#RGB or #RRGGBB)
    const hexPattern = /^#([A-Fa-f0-9]{3}){1,2}$/;
    return hexPattern.test(color);
}

// Function to get parameters from the URL
function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return {
        lang: params.get('lang'),
        theme: params.get('theme'),
        color: params.get('color'),
        hideBack: params.get('hideBack')
    };
}

// Function to detect language (priority: URL > localStorage > default)
function getInitialLanguage(urlLang) {
    if (urlLang && ['en', 'ru', 'uk', 'be', 'pl', 'cs'].includes(urlLang)) {
        localStorage.setItem("doc_lang", urlLang);
        return urlLang;
    }
    return localStorage.getItem("doc_lang") || "en";
}

// Function to detect theme (priority: URL > localStorage > default)
function getInitialTheme(urlTheme) {
    if (urlTheme && ['light', 'dark'].includes(urlTheme)) {
        localStorage.setItem("doc_theme", urlTheme);
        return urlTheme;
    }
    return localStorage.getItem("doc_theme") || "light";
}

// Function to detect color (priority: URL > localStorage)
function getInitialColor(urlColor) {
    if (urlColor && isValidColor(urlColor)) {
        localStorage.setItem("doc_color", urlColor);
        return urlColor;
    }
    return localStorage.getItem("doc_color") || "#007bff";
}

// Function to apply the color
function applyColor(color) {
    document.documentElement.style.setProperty('--accent', color);
    // Update the color in the feature-list background (rgba version)
    const rgb = hexToRgb(color);
    if (rgb) {
        document.documentElement.style.setProperty('--accent-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
        // Update the background for feature-list if needed
        const featureLists = document.querySelectorAll('.feature-list');
        featureLists.forEach(el => {
            el.style.backgroundColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.05)`;
        });
    }
}

// HEX to RGB conversion function
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : null;
}

// Function to update the URL with current parameters
function updateUrlParams(lang, theme, color) {
    const url = new URL(window.location);
    url.searchParams.set('lang', lang);
    url.searchParams.set('theme', theme);
    if (color) {
        url.searchParams.set('color', color);
    }
    window.history.replaceState({}, '', url);
}

// Updated settings loading function
function loadSettings() {
    const urlParams = getUrlParams();
    const initialLang = getInitialLanguage(urlParams.lang);
    const initialTheme = getInitialTheme(urlParams.theme);
    const initialColor = getInitialColor(urlParams.color);
    
    document.documentElement.lang = initialLang;
    document.documentElement.setAttribute("data-theme", initialTheme);
    languageSelect.value = initialLang;
    
    applyTranslations(initialLang);
    applyThemeLabel(initialLang, initialTheme);
    themeDot.style.backgroundColor = initialTheme === "dark" ? "#ffd54f" : "#222222";
    applyColor(initialColor);
    
    // Update the URL if parameters do not match or are missing
    if (urlParams.lang !== initialLang || urlParams.theme !== initialTheme || urlParams.color !== initialColor) {
        updateUrlParams(initialLang, initialTheme, initialColor);
    }
}

// Translation functions
function applyTranslations(lang) {
    const dict = translations[lang] || translations.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
    });
}

function applyThemeLabel(lang, theme) {
    const labels = themeLabels[lang] || themeLabels.en;
    themeLabel.textContent = labels[theme];
}

// Language handler
languageSelect.addEventListener("change", () => {
    const lang = languageSelect.value;
    const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
    const currentColor = localStorage.getItem("doc_color") || "#007bff";
    
    localStorage.setItem("doc_lang", lang);
    document.documentElement.lang = lang;
    applyTranslations(lang);
    applyThemeLabel(lang, currentTheme);
    updateUrlParams(lang, currentTheme, currentColor);
});

// Theme handler
themeToggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    const next = current === "light" ? "dark" : "light";
    const currentLang = languageSelect.value;
    const currentColor = localStorage.getItem("doc_color") || "#007bff";
    
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("doc_theme", next);
    applyThemeLabel(currentLang, next);
    themeDot.style.backgroundColor = next === "dark" ? "#ffd54f" : "#222222";
    updateUrlParams(currentLang, next, currentColor);
});

backHomeBtn.addEventListener("click", () => {
    const urlParams = getUrlParams();
    const lang = getInitialLanguage(urlParams.lang);
    const theme = getInitialTheme(urlParams.theme);
    const color = getInitialColor(urlParams.color);
    window.location.href = '/';
});

loadSettings();
if (getUrlParams().hideBack === '1') { backHomeBtn.style.display = 'none'; document.getElementById('languageSelect').style.display = 'none'; document.getElementById('themeToggle').style.display = 'none'; }
</script>
